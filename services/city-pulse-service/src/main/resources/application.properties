# CityPulse — single deployable service (city resolution + weather + air quality + orchestration)
quarkus.application.name=city-pulse-service

# Open-Meteo forecast API (no API key required)
quarkus.rest-client.open-meteo.url=https://api.open-meteo.com
quarkus.rest-client.open-meteo.connect-timeout=3000
quarkus.rest-client.open-meteo.read-timeout=5000

# Open-Meteo Air Quality API (no API key required)
quarkus.rest-client.open-meteo-air-quality.url=https://air-quality-api.open-meteo.com
quarkus.rest-client.open-meteo-air-quality.connect-timeout=3000
quarkus.rest-client.open-meteo-air-quality.read-timeout=5000

# Photon geocoding / autocomplete (Komoot's public instance, OSM-based, no API key required)
quarkus.rest-client.photon.url=https://photon.komoot.io
quarkus.rest-client.photon.connect-timeout=3000
quarkus.rest-client.photon.read-timeout=5000

# Basic observability: log every request (CLAUDE.md section 32)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%{REMOTE_HOST} "%r" %s %Dms
